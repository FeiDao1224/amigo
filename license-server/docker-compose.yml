services:
  amigo-license:
    build: .
    container_name: amigo-license
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - LICENSE_DB=/data/licenses.json
      - LICENSE_SIGNING_KEY_FILE=/data/license-private.pem
    volumes:
      - ./data:/data           # licenses.json 持久化到宿主机 ./data
    restart: unless-stopped
