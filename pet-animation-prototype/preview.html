<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lazy Fish Pet Animation Preview</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background: #f3f5f1;
      color: #181b1d;
    }
    body {
      margin: 0;
      padding: 28px;
    }
    h1 {
      margin: 0 0 18px;
      font-size: 26px;
      letter-spacing: 0;
    }
    h2 {
      margin: 30px 0 14px;
      font-size: 18px;
      letter-spacing: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
      max-width: 1240px;
    }
    figure {
      margin: 0;
      background: white;
      border: 1px solid #d9ded6;
      border-radius: 8px;
      overflow: hidden;
    }
    img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      display: block;
      background:
        linear-gradient(45deg, #f7f8f4 25%, transparent 25%),
        linear-gradient(-45deg, #f7f8f4 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f7f8f4 75%),
        linear-gradient(-45deg, transparent 75%, #f7f8f4 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    }
    figcaption {
      padding: 10px 12px 12px;
      font-size: 14px;
      font-weight: 650;
    }
  </style>
</head>
<body>
  <h1>Lazy Fish Pet Animation Preview</h1>
  <h2>Normal</h2>
  <section class="grid">
    <figure><img src="normal/gifs/idle.gif" alt="Idle"><figcaption>Idle / breathing</figcaption></figure>
    <figure><img src="normal/gifs/work_desk.gif" alt="Desk work"><figcaption>Desk work</figcaption></figure>
    <figure><img src="normal/gifs/coffee.gif" alt="Coffee"><figcaption>Drink coffee</figcaption></figure>
    <figure><img src="normal/gifs/burger.gif" alt="Burger"><figcaption>Eat burger</figcaption></figure>
    <figure><img src="normal/gifs/phone.gif" alt="Phone"><figcaption>Play phone</figcaption></figure>
    <figure><img src="normal/gifs/walk.gif" alt="Walk"><figcaption>Walk</figcaption></figure>
    <figure><img src="normal/gifs/lie.gif" alt="Lie down"><figcaption>Lie down</figcaption></figure>
    <figure><img src="normal/gifs/sleep.gif" alt="Sleep"><figcaption>Sleep</figcaption></figure>
    <figure><img src="normal/gifs/wave.gif" alt="Wave"><figcaption>Wave</figcaption></figure>
    <figure><img src="normal/gifs/focus.gif" alt="Focused work"><figcaption>Focused work</figcaption></figure>
  </section>
  <h2>Pixel</h2>
  <section class="grid">
    <figure><img src="pixel/gifs/idle.gif" alt="Pixel idle"><figcaption>Idle / breathing</figcaption></figure>
    <figure><img src="pixel/gifs/work_desk.gif" alt="Pixel desk work"><figcaption>Desk work</figcaption></figure>
    <figure><img src="pixel/gifs/coffee.gif" alt="Pixel coffee"><figcaption>Drink coffee</figcaption></figure>
    <figure><img src="pixel/gifs/burger.gif" alt="Pixel burger"><figcaption>Eat burger</figcaption></figure>
    <figure><img src="pixel/gifs/phone.gif" alt="Pixel phone"><figcaption>Play phone</figcaption></figure>
    <figure><img src="pixel/gifs/walk.gif" alt="Pixel walk"><figcaption>Walk</figcaption></figure>
    <figure><img src="pixel/gifs/lie.gif" alt="Pixel lie down"><figcaption>Lie down</figcaption></figure>
    <figure><img src="pixel/gifs/sleep.gif" alt="Pixel sleep"><figcaption>Sleep</figcaption></figure>
    <figure><img src="pixel/gifs/wave.gif" alt="Pixel wave"><figcaption>Wave</figcaption></figure>
    <figure><img src="pixel/gifs/focus.gif" alt="Pixel focused work"><figcaption>Focused work</figcaption></figure>
  </section>
</body>
</html>
