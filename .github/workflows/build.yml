name: Build Amigo

on:
  push:
    tags: ['v*']          # 打 v* 标签 → 自动构建并发 Release
  workflow_dispatch:       # 也可在 Actions 页手动触发

permissions:
  contents: write          # 建 Release 需要写权限

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift 版本
        run: swift --version

      - name: 编译 (release)
        run: swift build -c release

      - name: 打包 .app (含图标/形象/自签)
        run: bash tools/package-app.sh

      - name: 压成 zip (ditto 保留签名)
        run: ditto -c -k --sequesterRsrc --keepParent dist/Amigo.app dist/Amigo.zip

      - name: 上传构建产物 (Actions 页可下载)
        uses: actions/upload-artifact@v4
        with:
          name: Amigo-app
          path: dist/Amigo.zip

      - name: 发 Release (打标签时)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="ad-hoc 自签构建。首次打开若被拦：右键→打开，或终端 \`xattr -cr Amigo.app\` 再双击。"
          gh release create "${{ github.ref_name }}" dist/Amigo.zip \
            --title "Amigo ${{ github.ref_name }}" --notes "$NOTES" \
          || gh release upload "${{ github.ref_name }}" dist/Amigo.zip --clobber
